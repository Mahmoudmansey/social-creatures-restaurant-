<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- ============================================================
  index.html — Kitchen & Bar POS
  شاشة عرض منيو بأسلوب Odoo POS + سلة + مطبخ + مزامنة
  يعمل مع ملف: pos-sync.js
============================================================ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen &amp; Bar — POS</title>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.0.0/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.0.0/600.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.0.0/700.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.0.0/800.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/600.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/700.css" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root{
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --sp:clamp(14px,2.2vw,26px);
  --f-ar:'Cairo',system-ui,sans-serif;--f-en:'Inter',system-ui,sans-serif;
  --dur:.26s;--ease:cubic-bezier(.4,0,.2,1);--maxw:1440px;
}
html[data-theme="light"]{
  --bg:#f4f1ea;--surface:#ffffff;--surface-2:#faf7f0;--surface-3:#efe9dd;
  --text:#1d1a15;--text-2:#5d564b;--muted:#8e8578;
  --border:#e6ddcd;--border-2:#d7cbb5;
  --accent:#b8802a;--accent-2:#d9a441;--accent-ink:#fff;--accent-soft:#fbf0dc;
  --danger:#c0392b;--danger-soft:#fbe9e7;--ok:#2f7a4f;--ok-soft:#e6f4ec;--info:#2b6cb0;--info-soft:#e8f1fa;
  --shadow-s:0 1px 2px rgba(45,32,12,.06),0 2px 8px rgba(45,32,12,.05);
  --shadow-m:0 8px 20px rgba(45,32,12,.10);
  --shadow-l:0 26px 60px rgba(45,32,12,.20);
  --scrim:rgba(30,22,10,.48);
}
html[data-theme="dark"]{
  --bg:#131110;--surface:#1d1a18;--surface-2:#242120;--surface-3:#2d2927;
  --text:#f4efe6;--text-2:#c5bcae;--muted:#8f8577;
  --border:#342f2b;--border-2:#453e37;
  --accent:#e2aa4e;--accent-2:#f2c476;--accent-ink:#1c1406;--accent-soft:#342a10;
  --danger:#ea7c6f;--danger-soft:#3c2320;--ok:#6fc79a;--ok-soft:#183222;--info:#7cb1e0;--info-soft:#17293a;
  --shadow-s:0 1px 2px rgba(0,0,0,.45);--shadow-m:0 10px 26px rgba(0,0,0,.5);--shadow-l:0 30px 70px rgba(0,0,0,.68);
  --scrim:rgba(0,0,0,.66);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--text);font-family:var(--f-ar);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 560px at 100% -10%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 60%),
    radial-gradient(900px 480px at -10% 0%,color-mix(in srgb,var(--accent) 6%,transparent),transparent 55%),
    var(--bg);
  transition:background-color var(--dur),color var(--dur);
}
html[lang="en"] body{font-family:var(--f-en)}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.icn{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icn.sm{width:16px;height:16px}.icn.lg{width:26px;height:26px}
.spacer{flex:1}

/* ================= TOPBAR ================= */
.topbar{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--border)}
.topbar-in{max-width:var(--maxw);margin:0 auto;padding:10px var(--sp);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo-wrap{width:46px;height:46px;border-radius:14px;overflow:hidden;flex:none;background:linear-gradient(145deg,var(--accent-2),var(--accent));display:grid;place-items:center;box-shadow:var(--shadow-s);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--border))}
.logo-wrap img{width:100%;height:100%;object-fit:cover}
.logo-wrap svg{width:27px;height:27px;color:var(--accent-ink)}
.brand-name{font-size:15.5px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;flex:1;max-width:430px;min-width:140px}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);padding:0 16px;font-size:14px;transition:all var(--dur)}
html[dir="ltr"] .search input{padding-right:44px}
html[dir="rtl"] .search input{padding-left:44px}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent);background:var(--surface)}
.search .s-icn{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.icon-btn{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all var(--dur);position:relative}
.icon-btn:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-s)}
.icon-btn:active{transform:scale(.95)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.badge{position:absolute;top:-5px;inset-inline-end:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface);line-height:1}
.badge.pop{animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(.4)}55%{transform:scale(1.35)}100%{transform:scale(1)}}
.sync-pill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:700;color:var(--text-2);flex:none}
.sync-dot{width:9px;height:9px;border-radius:99px;background:var(--muted);flex:none}
.sync-pill.ok .sync-dot{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 18%,transparent)}
.sync-pill.bad .sync-dot{background:var(--danger)}
.sync-pill.cloud .sync-dot{background:var(--info);box-shadow:0 0 0 4px color-mix(in srgb,var(--info) 18%,transparent)}

/* ================= TOOLBAR / GRID ================= */
main{max-width:var(--maxw);margin:0 auto;padding:0 var(--sp) 96px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 0 8px;position:sticky;top:67px;z-index:40;background:linear-gradient(to bottom,var(--bg) 74%,transparent)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;flex:1;min-width:0}
.cats::-webkit-scrollbar{display:none}
.cat{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none;padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all var(--dur)}
.cat:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.cat.on{background:var(--text);color:var(--bg);border-color:var(--text)}
html[data-theme="dark"] .cat.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cat .cnt{font-size:11px;opacity:.6;font-weight:700}
.sel-wrap{position:relative;flex:none}
.sel-wrap select{appearance:none;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-2)}
html[dir="ltr"] .sel-wrap select{padding-right:34px}
html[dir="rtl"] .sel-wrap select{padding-left:34px}
.sel-wrap .chev{position:absolute;inset-inline-end:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.result-bar{display:flex;align-items:center;gap:10px;padding:4px 2px 12px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.result-bar b{color:var(--text)}
.link-btn{color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;position:relative;transition:transform var(--dur),box-shadow var(--dur),border-color var(--dur);animation:rise .45s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-m);border-color:var(--border-2)}
.card-media{height:148px;position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(140deg,var(--g1),var(--g2))}
.card-media::after{content:"";position:absolute;inset:0;opacity:.26;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.5) 1px,transparent 0);background-size:16px 16px}
.card-emoji{font-size:56px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.28));z-index:1;transition:transform .4s var(--ease)}
.card:hover .card-emoji{transform:scale(1.14) rotate(-4deg)}
.fav{position:absolute;top:10px;inset-inline-end:10px;z-index:2;width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#7a6a58;backdrop-filter:blur(6px);transition:transform .2s;border:1px solid rgba(0,0,0,.06)}
.fav:hover{transform:scale(1.12)}
.fav.on{color:#e0455e}.fav.on svg{fill:#e0455e}
.pill-cat{position:absolute;top:10px;inset-inline-start:10px;z-index:2;padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.42);color:#fff;backdrop-filter:blur(6px)}
.card-body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-title{font-size:14.5px;font-weight:700;line-height:1.45;margin:0}
.card-desc{font-size:12px;color:var(--muted);line-height:1.6;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2)}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:3px}
.price{font-size:19px;font-weight:800;color:var(--accent);white-space:nowrap}
.price small{font-size:11px;font-weight:600;color:var(--muted);margin-inline-start:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:12px;font-size:13.5px;font-weight:700;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn-primary:hover{background:var(--accent-2);transform:translateY(-1px)}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-block{width:100%}.btn-lg{height:48px;font-size:14.5px;border-radius:14px}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px}
.empty .e-icn{font-size:52px;opacity:.5}
.empty h3{margin:14px 0 6px;font-size:18px}
.empty p{margin:0 0 18px;color:var(--muted);font-size:14px}

/* ================= DRAWER ================= */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:90;opacity:0;pointer-events:none;transition:opacity var(--dur);backdrop-filter:blur(3px)}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);z-index:100;background:var(--surface);border-inline-start:1px solid var(--border);display:flex;flex-direction:column;box-shadow:var(--shadow-l);transform:translateX(100%);transition:transform var(--dur) var(--ease)}
html[dir="rtl"] .drawer{transform:translateX(-100%)}
.drawer.open{transform:none!important}
.d-head{padding:16px var(--sp);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.d-head h2{margin:0;font-size:17px;font-weight:800}
.d-head .sub{font-size:12px;color:var(--muted);margin-top:2px}
.d-body{flex:1;overflow-y:auto;padding:12px var(--sp);overscroll-behavior:contain}
.d-foot{flex:none;border-top:1px solid var(--border);padding:14px var(--sp) calc(14px + env(safe-area-inset-bottom));background:var(--surface-2)}
.c-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--border);animation:rise .3s var(--ease)}
.c-thumb{width:54px;height:54px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:26px;background:linear-gradient(140deg,var(--g1),var(--g2))}
.c-info{flex:1;min-width:0}
.c-name{font-size:13px;font-weight:700;line-height:1.4;margin:0 0 3px}
.c-price{font-size:12px;color:var(--muted)}
.c-price b{color:var(--accent);font-size:13.5px}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--surface-3);border-radius:999px;padding:3px;border:1px solid var(--border)}
.qty button{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;color:var(--text-2);transition:all .18s}
.qty button:hover{background:var(--accent);color:var(--accent-ink)}
.qty span{min-width:22px;text-align:center;font-size:13px;font-weight:700}
.c-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px}
.x-btn{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:all .18s}
.x-btn:hover{background:var(--danger-soft);color:var(--danger)}
.totals{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.trow{display:flex;justify-content:space-between;font-size:13.5px;color:var(--text-2)}
.trow.big{font-size:19px;font-weight:800;color:var(--text);padding-top:9px;border-top:1px solid var(--border)}
.trow.big span:last-child{color:var(--accent)}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.03em}
.input,.textarea{width:100%;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:10px 13px;font-size:13.5px;transition:all .2s}
.input:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.textarea{resize:vertical;min-height:62px;line-height:1.6}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-3);padding:4px;border-radius:13px;border:1px solid var(--border)}
.seg button{padding:9px 6px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--text-2);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-s)}
html[data-theme="dark"] .seg button.on{background:var(--accent);color:var(--accent-ink)}

/* ================= MODALS ================= */
.modal{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity var(--dur)}
.modal.show{opacity:1;pointer-events:auto}
.m-box{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-l);max-height:min(90vh,880px);display:flex;flex-direction:column;overflow:hidden;transform:translateY(16px) scale(.98);transition:transform var(--dur)}
.modal.show .m-box{transform:none}
.m-box.w-sm{max-width:460px}.m-box.w-md{max-width:580px}.m-box.w-lg{max-width:900px}
.m-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.m-head h2{margin:0;font-size:17px;font-weight:800}
.m-body{padding:18px 20px;overflow-y:auto;flex:1}
.m-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--surface-2);flex-wrap:wrap;align-items:center}
.sec{margin-bottom:24px}.sec:last-child{margin-bottom:0}
.sec-t{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.08em;margin-bottom:13px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--border)}
.opt-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.opt-row:last-child{border-bottom:none}
.opt-txt{flex:1;min-width:200px}
.opt-txt .t{font-size:14px;font-weight:700;margin-bottom:2px}
.opt-txt .d{font-size:12px;color:var(--muted);line-height:1.5}
.opt-ctl{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo-edit{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-preview{width:76px;height:76px;border-radius:20px;overflow:hidden;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent-2),var(--accent));border:1px solid var(--border)}
.logo-preview img{width:100%;height:100%;object-fit:cover}
.logo-preview svg{width:42px;height:42px;color:var(--accent-ink)}
.item-hero{height:185px;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(140deg,var(--g1),var(--g2))}
.item-hero::after{content:"";position:absolute;inset:0;opacity:.28;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.55) 1px,transparent 0);background-size:18px 18px}
.item-hero .big{font-size:80px;filter:drop-shadow(0 12px 20px rgba(0,0,0,.3));z-index:1}
.item-hero .close{position:absolute;top:12px;inset-inline-end:12px;z-index:2;width:36px;height:36px;border-radius:999px;background:rgba(0,0,0,.42);color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px);transition:all .2s}
.item-hero .close:hover{background:rgba(0,0,0,.65);transform:rotate(90deg)}

/* ticket */
.ticket{background:#fff;color:#1b1815;border-radius:var(--r-md);padding:20px;border:1px dashed #cfc4ae;font-family:var(--f-en)}
html[lang="ar"] .ticket{font-family:var(--f-ar)}
.ticket h3{margin:0 0 3px;font-size:18px;text-align:center}
.ticket .t-sub{text-align:center;font-size:11.5px;color:#8b8378;margin-bottom:12px}
.ticket .t-meta{display:flex;justify-content:space-between;font-size:11.5px;color:#5b544c;padding-bottom:9px;border-bottom:1px dashed #e6dfd3;margin-bottom:9px;flex-wrap:wrap;gap:6px}
.ticket table{width:100%;border-collapse:collapse;font-size:13px}
.ticket th{text-align:start;font-size:10.5px;color:#8b8378;padding:0 0 7px;border-bottom:1px solid #e6dfd3}
.ticket td{padding:7px 0;border-bottom:1px dashed #f0ebe2;vertical-align:top}
.ticket .num{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.ticket .t-tot{margin-top:11px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.ticket .t-tot .r{display:flex;justify-content:space-between}
.ticket .t-tot .r.grand{font-size:17px;font-weight:800;border-top:2px solid #1b1815;padding-top:8px;margin-top:4px}
.ticket .t-thanks{text-align:center;font-size:11.5px;color:#8b8378;margin-top:14px}

/* kitchen */
.k-order{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface-2);overflow:hidden;animation:rise .35s var(--ease)}
.k-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.k-no{font-weight:800;font-size:15px}
.k-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--info-soft);color:var(--info)}
.k-pill.tbl{background:var(--accent-soft);color:var(--accent)}
.k-time{font-size:11.5px;color:var(--muted)}
.k-items{padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.k-line{display:flex;gap:9px;align-items:baseline;font-size:13.5px}
.k-line b{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:1px 8px;font-size:12.5px;flex:none}
.k-note{margin:0 14px 10px;padding:8px 11px;border-radius:10px;background:var(--surface-3);font-size:12px;color:var(--text-2)}
.k-foot{display:flex;gap:9px;padding:11px 14px;border-top:1px solid var(--border);align-items:center;flex-wrap:wrap}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}

/* toasts */
.toasts{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
html[dir="rtl"] .toasts{transform:translateX(50%)}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;background:var(--text);color:var(--bg);font-size:13.5px;font-weight:600;box-shadow:var(--shadow-l);animation:tin .32s var(--ease);max-width:min(92vw,430px)}
.toast.out{animation:tout .3s var(--ease) forwards}
@keyframes tin{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(10px) scale(.96)}}
.toast .dot{width:8px;height:8px;border-radius:99px;background:var(--accent-2);flex:none}
.m-cart{position:fixed;bottom:0;left:0;right:0;z-index:70;display:none;padding:10px var(--sp) calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--border)}
.m-cart.show{display:block}

@media(max-width:860px){
  .topbar-in{gap:9px}
  .search{order:3;flex-basis:100%;max-width:none}
  .toolbar{top:0;position:static;background:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px}
  .card-media{height:115px}.card-emoji{font-size:42px}
  .card-body{padding:10px 11px 11px}.card-title{font-size:13px}.card-desc{display:none}.price{font-size:16px}
  .btn-add-lbl{display:none}.btn-add{width:38px;height:38px;padding:0;border-radius:11px}
  .drawer{width:100%}.sync-pill span.lbl{display:none}
}
@media(max-width:400px){.grid{grid-template-columns:1fr 1fr;gap:9px}}
@media print{body>*{display:none!important}#printRoot{display:block!important;position:fixed;inset:0;background:#fff;padding:24px;overflow:auto}}
#printRoot{display:none}
</style>

/* ================= CATEGORIES / GRID ================= */
function renderCats(){
 const box=document.getElementById('cats');
 const counts={};MENU.forEach(m=>counts[m.cat]=(counts[m.cat]||0)+1);
 const chip=(id,label,cnt)=>`<button class="cat ${ui.cat===id?'on':''}" data-cat="${id}">${label}<span class="cnt">${cnt}</span></button>`;
 box.innerHTML=chip('all',t('all'),MENU.length)+CATS.map(c=>chip(c.id,`${c.icon} ${S.lang==='ar'?c.ar:c.en}`,counts[c.id]||0)).join('');
 box.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{ui.cat=b.dataset.cat;renderCats();renderGrid();});
}
function filtered(){
 let list=MENU.slice();
 if(ui.cat!=='all')list=list.filter(m=>m.cat===ui.cat);
 if(ui.favOnly)list=list.filter(m=>favs.includes(m.id));
 const q=ui.q.trim().toLowerCase();
 if(q)list=list.filter(m=>{const c=catOf(m.cat);
  return (m.en.n+' '+m.en.d+' '+m.ar.n+' '+m.ar.d+' '+(c?c.en+c.ar:'')).toLowerCase().includes(q);});
 if(ui.sort==='asc')list.sort((a,b)=>a.price-b.price);
 if(ui.sort==='desc')list.sort((a,b)=>b.price-a.price);
 if(ui.sort==='name')list.sort((a,b)=>a[S.lang].n.localeCompare(b[S.lang].n,S.lang==='ar'?'ar':'en'));
 if(ui.sort==='pop')list.sort((a,b)=>b.pop-a.pop);
 return list;
}
function renderGrid(){
 const list=filtered(),grid=document.getElementById('grid');
 const bits=[`${t('showing')} <b>${list.length}</b> ${t('of')} <b>${MENU.length}</b> ${t('items')}`];
 if(ui.favOnly)bits.push(`· <b style="color:var(--accent)">${t('favOnly')}</b>`);
 if(ui.q.trim())bits.push(`· “${esc(ui.q.trim())}”`);
 document.getElementById('resultBar').innerHTML=bits.join(' ')+
  ((ui.q||ui.favOnly||ui.cat!=='all')?` <button class="link-btn" id="clrF">${t('clearF')}</button>`:'');
 const clr=document.getElementById('clrF');
 if(clr)clr.onclick=()=>{ui.q='';ui.favOnly=false;ui.cat='all';document.getElementById('searchInput').value='';
  document.getElementById('btnFav').classList.remove('on');document.getElementById('favIcn').style.fill='none';renderCats();renderGrid();};
 if(!list.length){
  grid.innerHTML=`<div class="empty"><div class="e-icn">${ui.favOnly?'💛':'🔍'}</div>
   <h3>${ui.favOnly?t('emptyFavT'):t('emptyT')}</h3><p>${ui.favOnly?t('emptyFavS'):t('emptyS')}</p>
   <button class="btn btn-ghost" id="eClr">${t('clearF')}</button></div>`;
  document.getElementById('eClr').onclick=()=>{ui.q='';ui.favOnly=false;ui.cat='all';
   document.getElementById('searchInput').value='';document.getElementById('btnFav').classList.remove('on');
   document.getElementById('favIcn').style.fill='none';renderCats();renderGrid();};
  return;}
 grid.innerHTML=list.map((m,i)=>{const c=catOf(m.cat),isFav=favs.includes(m.id);
  return `<article class="card" style="animation-delay:${Math.min(i*40,320)}ms">
   <div class="card-media" style="--g1:${m.g[0]};--g2:${m.g[1]}">
    <span class="pill-cat">${S.lang==='ar'?c.ar:c.en}</span>
    <button class="fav ${isFav?'on':''}" data-fav="${m.id}" aria-label="favourite">${SVG.heart}</button>
    <span class="card-emoji">${m.emoji}</span></div>
   <div class="card-body">
    <h3 class="card-title">${esc(m[S.lang].n)}</h3>
    <p class="card-desc">${esc(m[S.lang].d)}</p>
    <div class="tags">${(m.tags||[]).slice(0,3).map(x=>`<span class="tag">${t('tags')[x]||x}</span>`).join('')}</div>
    <div class="card-foot"><span class="price">${money(m.price)}</span><div class="spacer"></div>
     <button class="btn btn-ghost" style="width:38px;height:38px;padding:0;border-radius:11px" data-view="${m.id}">
      <svg class="icn sm" viewBox="0 0 24 24"><path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>

    </div></div></article>`;}).join('');
 grid.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToCart(b.dataset.add));
 grid.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openItem(b.dataset.view));
 grid.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>toggleFav(b.dataset.fav));
}
function toggleFav(id){const i=favs.indexOf(id);
 if(i>-1){favs.splice(i,1);toast(t('favOff'));}else{favs.push(id);toast(t('favOn'));}
 persist();renderGrid();}

/* ================= CART ================= */
const cartCount=()=>cart.reduce((s,c)=>s+c.qty,0);
const subTotal=()=>cart.reduce((s,c)=>s+(item(c.id)?.price||0)*c.qty,0);
const serviceAmount=()=>Math.round(subTotal()*(Number(S.service)||0))/100;
const grandTotal=()=>Math.round((subTotal()+serviceAmount())*100)/100;
function addToCart(id,n=1){const l=cart.find(c=>c.id===id);
 if(l)l.qty+=n;else cart.push({id,qty:n});
 persist();renderCart();badgePop();toast(t('addedToast').replace('{n}',item(id)[S.lang].n));}
function setQty(id,q){const l=cart.find(c=>c.id===id);if(!l)return;
 l.qty=q;if(l.qty<=0)cart=cart.filter(c=>c.id!==id);persist();renderCart();}
function removeLine(id){const n=item(id)[S.lang].n;cart=cart.filter(c=>c.id!==id);
 persist();renderCart();toast(t('removedToast').replace('{n}',n));}
function badgePop(){const b=document.getElementById('cartBadge');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');}
function renderCart(){
 const n=cartCount(),b=document.getElementById('cartBadge');
 b.textContent=n;b.style.display=n?'grid':'none';
 document.getElementById('cartSub').textContent=`${n} ${t('itemsCount')}`;
 const body=document.getElementById('cartBody'),foot=document.getElementById('cartFoot'),mbar=document.getElementById('mCart');
 if(!cart.length){
  body.innerHTML=`<div class="empty" style="padding:50px 10px"><div class="e-icn">🧺</div><h3>${t('cartEmpty')}</h3><p>${t('cartEmptyS')}</p></div>`;
  foot.innerHTML=`<button class="btn btn-ghost btn-block" id="clsD">${t('close')}</button>`;
  document.getElementById('clsD').onclick=closeDrawer;mbar.classList.remove('show');mbar.innerHTML='';return;}
 body.innerHTML=cart.map(c=>{const m=item(c.id);if(!m)return '';
  return `<div class="c-item">
   <div class="c-thumb" style="--g1:${m.g[0]};--g2:${m.g[1]}">${m.emoji}</div>
   <div class="c-info"><p class="c-name">${esc(m[S.lang].n)}</p>
    <div class="c-price">${money(m.price)} × ${c.qty} = <b>${money(m.price*c.qty)}</b></div></div>
   <div class="c-right"><button class="x-btn" data-rm="${m.id}">${SVG.trash}</button>
    <div class="qty"><button data-dec="${m.id}">${SVG.minus}</button><span>${c.qty}</span><button data-inc="${m.id}">${SVG.plus}</button></div></div></div>`;}).join('');
 foot.innerHTML=`<div class="totals">
   <div class="trow"><span>${t('subtotal')}</span><span>${money(subTotal())}</span></div>
   <div class="trow"><span>${t('service')} (${Number(S.service)||0}%)</span><span>${money(serviceAmount())}</span></div>
   <div class="trow big"><span>${t('total')}</span><span>${money(grandTotal())}</span></div></div>
  <button class="btn btn-primary btn-lg btn-block" id="goCheckout">${t('checkout')} · ${money(grandTotal())}</button>
  <button class="btn btn-ghost btn-block" style="margin-top:8px;height:38px" id="goClear">${SVG.trash} ${t('clearCart')}</button>`;
 mbar.classList.add('show');
 mbar.innerHTML=`<button class="btn btn-primary btn-lg btn-block" id="mGo">${t('checkout')} · ${n} ${t('itemsCount')} · ${money(grandTotal())}</button>`;
 document.getElementById('mGo').onclick=openDrawer;
 body.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>setQty(b.dataset.inc,(cart.find(c=>c.id===b.dataset.inc)?.qty||0)+1));
 body.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>setQty(b.dataset.dec,(cart.find(c=>c.id===b.dataset.dec)?.qty||0)-1));
 body.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>removeLine(b.dataset.rm));
 document.getElementById('goCheckout').onclick=openCheckout;
 document.getElementById('goClear').onclick=()=>{cart=[];persist();renderCart();toast(t('cartCleared'));};
}

    <div class="qty" style="padding:4px">
     <button id="qMinus" style="width:32px;height:32px">${SVG.minus}</button>
     <span id="qVal" style="min-width:30px;font-size:15px">${itemQty}</span>
     <button id="qPlus" style="width:32px;height:32px">${SVG.plus}</button></div>
    <div class="spacer"></div><span class="price" style="font-size:20px">${money(m.price*itemQty)}</span></div></div>
  <div class="m-foot">
   <button class="btn btn-ghost" id="iFav">${SVG.heart} ${favs.includes(m.id)?'♥':'♡'}</button>
   <div class="spacer"></div>
   <button class="btn btn-primary btn-lg" id="iAdd">${t('add')} · ${money(m.price*itemQty)}</button></div>`;
  box.querySelector('#iClose').onclick=()=>closeModal('mItem');
  box.querySelector('#qMinus').onclick=()=>{itemQty=Math.max(1,itemQty-1);draw();};
  box.querySelector('#qPlus').onclick=()=>{itemQty=Math.min(99,itemQty+1);draw();};
  box.querySelector('#iFav').onclick=()=>{toggleFav(m.id);draw();};
  box.querySelector('#iAdd').onclick=()=>{addToCart(m.id,itemQty);closeModal('mItem');};};
 draw();openModal('mItem');}

/* ================= CHECKOUT + SYNC ================= */
function orderNumber(){const d=new Date();
 return 'ORD-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+String(d.getSeconds()).padStart(2,'0');}
function ticketRows(){return cart.map(c=>{const m=item(c.id);if(!m)return '';
 return `<tr><td>${esc(m[S.lang].n)}${c.qty>1?` <span style="color:#8b8378">×${c.qty}</span>`:''}</td><td class="num">${money(m.price*c.qty)}</td></tr>`;}).join('');}
let lastTicket=null;
function openCheckout(){
 if(!cart.length)return;
 const box=document.getElementById('mCheckoutBox');
 const opt=(v,lbl,ic)=>`<button data-otype="${v}" class="${ord.type===v?'on':''}">${ic} ${lbl}</button>`;
 const pay=(v,lbl,ic)=>`<button data-pay="${v}" class="${ord.pay===v?'on':''}">${ic} ${lbl}</button>`;
 box.innerHTML=`
  <div class="m-head"><span style="font-size:22px">🧾</span><h2>${t('checkout')}</h2><div class="spacer"></div>
   <button class="icon-btn" data-close="mCheckout" style="width:38px;height:38px">${SVG.x}</button></div>
  <div class="m-body">
   <div class="field"><label>${t('orderType')}</label>
    <div class="seg">${opt('dinein',t('dinein'),'🍽️')}${opt('takeaway',t('takeaway'),'🥡')}${opt('delivery',t('delivery'),'🛵')}</div></div>
   <div id="tblWrap" style="${ord.type==='dinein'?'':'display:none'}"><div class="field"><label>${t('tableNo')}</label>
    <input class="input" id="tblInput" inputmode="numeric" placeholder="${t('tablePh')}" value="${esc(ord.table)}"></div></div>
   <div class="field"><label>${t('orderNote')}</label>
    <textarea class="textarea" id="noteInput" placeholder="${t('notePh')}">${esc(ord.note)}</textarea></div>
   <div class="field"><label>${t('payment')}</label>
    <div class="seg">${pay('cash',t('cash'),'💵')}${pay('card',t('card'),'💳')}${pay('wallet',t('wallet'),'📱')}</div></div>
   <div class="ticket" id="ticketEl">
    <h3>${esc(S.name[S.lang]||'Menu')}</h3><div class="t-sub">${esc(S.tag[S.lang]||'')}</div>
    <table><thead><tr><th>${t('items')}</th><th class="num">${t('total')}</th></tr></thead><tbody>${ticketRows()}</tbody></table>
    <div class="t-tot">
     <div class="r"><span>${t('subtotal')}</span><span>${money(subTotal())}</span></div>
     <div class="r"><span>${t('service')} (${Number(S.service)||0}%)</span><span>${money(serviceAmount())}</span></div>
     <div class="r grand"><span>${t('total')}</span><span>${money(grandTotal())}</span></div></div></div>
  </div>
  <div class="m-foot">
   <button class="btn btn-ghost" data-close="mCheckout">${t('close')}</button><div class="spacer"></div>
   <button class="btn btn-primary btn-lg" id="goConfirm">📤 ${t('confirm')} · ${money(grandTotal())}</button></div>`;
 box.querySelectorAll('[data-otype]').forEach(b=>b.onclick=()=>{ord.type=b.dataset.otype;openCheckout();});
 box.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{ord.pay=b.dataset.pay;openCheckout();});
 const ti=box.querySelector('#tblInput');if(ti)ti.oninput=e=>ord.table=e.target.value;
 box.querySelector('#noteInput').oninput=e=>ord.note=e.target.value;
 box.querySelector('#goConfirm').onclick=confirmOrder;
 openModal('mCheckout');}
function confirmOrder(){
 const no=orderNumber(),now=new Date();
 const payLbl={cash:t('cash'),card:t('card'),wallet:t('wallet')}[ord.pay];
 const typeLbl=t(ord.type);
 const order={no,at:now.toISOString(),type:ord.type,typeLbl,
  table:ord.type==='dinein'?ord.table:'',note:ord.note,payment:ord.pay,paymentLbl:payLbl,
  items:cart.map(c=>{const m=item(c.id);return{sku:m.id,qty:c.qty,price:m.price,
   name:{ar:m.ar.n,en:m.en.n},emoji:m.emoji};}),
  totals:{sub:subTotal(),service:serviceAmount(),servicePct:Number(S.service)||0,total:grandTotal(),currency:t('cur')}};
 lastTicket=document.getElementById('ticketEl').outerHTML;
 const box=document.getElementById('mCheckoutBox');
 const hasSync=typeof PosSync!=='undefined';
 box.innerHTML=`<div class="m-head"><span style="font-size:24px">⏳</span><h2>…</h2></div>`;
 const done=()=>{
  const online=navigator.onLine;
  box.innerHTML=`
   <div class="m-head"><span style="width:40px;height:40px;border-radius:13px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center">${SVG.check}</span>
    <div><h2>${t('sentOk')}</h2><div style="font-size:12px;color:var(--muted);margin-top:2px">${t('orderNo')} <b>${no}</b>${online?'':' — '+t('offlineNote')}</div></div>
    <div class="spacer"></div><button class="icon-btn" data-close="mCheckout" style="width:38px;height:38px">${SVG.x}</button></div>
   <div class="m-foot">
    <button class="btn btn-ghost" id="cPrint">${SVG.print} ${t('print')}</button>
    <button class="btn btn-ghost" id="cCopy">${SVG.copy} ${t('copy')}</button>
    <button class="btn btn-ghost" id="cWa">${SVG.wa} ${t('whatsapp')}</button>
    <div class="spacer"></div>
    <button class="btn btn-primary btn-lg" id="cNew">${t('newOrder')}</button></div>`;
  box.querySelector('[data-close]').onclick=()=>{closeModal('mCheckout');closeDrawer();};
  box.querySelector('#cPrint').onclick=()=>{document.getElementById('printRoot').innerHTML=lastTicket;window.print();};
  box.querySelector('#cCopy').onclick=async()=>{const txt=plainOrder(order,now);
   try{await navigator.clipboard.writeText(txt);toast(t('copied'));}catch(e){
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(t('copied'));}};
  box.querySelector('#cWa').onclick=()=>{const num=String(S.wa||'').replace(/\D/g,'');
   if(!num){toast(t('waMissing'));closeModal('mCheckout');openSettings();return;}
   window.open(`https://wa.me/${num}?text=${encodeURIComponent(plainOrder(order,now))}`,'_blank');};
  box.querySelector('#cNew').onclick=()=>{cart=[];ord.table='';ord.note='';persist();renderCart();closeModal('mCheckout');closeDrawer();};
  cart=[];persist();renderCart();};
 if(hasSync){PosSync.pushOrder(order).then(done).catch(()=>toast('⚠️ Sync error'));}
 else done();}
function plainOrder(o,now){
 const lines=o.items.map(i=>`• ${i.name[S.lang]} × ${i.qty} — ${money(i.price*i.qty)}`);
 return [`${S.name[S.lang]||'Menu'} — ${t('orderNo')} ${o.no}`,
  now.toLocaleString(S.lang==='ar'?'ar-EG-u-nu-latn':'en-GB'),
  `${t('orderType')}: ${o.typeLbl}${o.type==='dinein'&&o.table?` — ${t('tableNo')} ${o.table}`:''}`,
  `${t('payment')}: ${o.paymentLbl}`,'',...lines,'',
  `${t('subtotal')}: ${money(o.totals.sub)}`,
  `${t('service')} (${o.totals.servicePct}%): ${money(o.totals.service)}`,
  `${t('total')}: ${money(o.totals.total)}`,
  o.note?`\n${t('orderNote')}: ${o.note}`:'',`\n${t('thanks')}`].filter(Boolean).join('\n');}

/* ================= KITCHEN ================= */
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString(S.lang==='ar'?'ar-EG-u-nu-latn':'en-GB',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function renderKitchen(){
 const grid=document.getElementById('kGrid');
 const orders=Object.values(kitchenOrders).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
 document.getElementById('kCountLbl').textContent=orders.length;
 const kb=document.getElementById('kBadge');kb.textContent=orders.length;kb.style.display=orders.length?'grid':'none';
 if(!orders.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1;padding:40px 10px"><div class="e-icn">👨‍🍳</div><h3>${t('kEmpty')}</h3></div>`;return;}
 grid.innerHTML=orders.map(o=>`
  <div class="k-order">
   <div class="k-head"><span class="k-no">#${esc(o.no||'')}</span>
    <span class="k-pill">${esc(o.typeLbl||t(o.type||'dinein'))}</span>
    ${o.type==='dinein'&&o.table?`<span class="k-pill tbl">${t('kTable')} ${esc(o.table)}</span>`:''}
    <div class="spacer"></div><span class="k-time">${fmtTime(o.at)}</span></div>
   <div class="k-items">${(o.items||[]).map(i=>`<div class="k-line"><b>×${i.qty}</b><span>${i.emoji||''} ${esc(i.name?i.name[S.lang]||i.name.en:'')}</span></div>`).join('')}</div>
   ${o.note?`<div class="k-note">📝 ${esc(o.note)}</div>`:''}
   <div class="k-foot"><span class="tag">💳 ${esc(o.paymentLbl||'')}</span><div class="spacer"></div>
    <button class="btn btn-primary" data-done="${esc(o.id||o.no)}">${SVG.check} ${t('kPrep')}</button></div></div>`).join('');
 grid.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.done;
  if(typeof PosSync!=='undefined')PosSync.markDone(id);
  delete kitchenOrders[id];renderKitchen();toast(t('kDone'));});}
if(typeof PosSync!=='undefined'){
 PosSync.subscribeOrders(o=>{kitchenOrders[o.id||o.no]=o;renderKitchen();
  toast(`🔔 ${t('orderNo')} ${o.no||''}`);});
 PosSync.onOrderRemoved(id=>{delete kitchenOrders[id];renderKitchen();});
 PosSync.loadPending().forEach(o=>{kitchenOrders[o.id||o.no]=o;});
}

/* ================= SYNC STATUS ================= */
function updateSyncPill(){
 const pill=document.getElementById('syncPill'),lbl=document.getElementById('syncLbl');
 pill.classList.remove('ok','bad','cloud');
 let st;
 if(typeof PosSync!=='undefined')st=PosSync.getStatus();
 else st={mode:'local',online:navigator.onLine,cloud:false};
 if(!st.online){pill.classList.add('bad');lbl.textContent=t('syncOff');}
 else if(st.mode==='firebase'&&st.cloud){pill.classList.add('cloud');lbl.textContent=t('syncCloudOn');}
 else{pill.classList.add('ok');lbl.textContent=t('syncOn');}}
if(typeof PosSync!=='undefined')PosSync.onStatus(updateSyncPill);
window.addEventListener('online',updateSyncPill);
window.addEventListener('offline',updateSyncPill);

/* ================= SETTINGS ================= */
function openSettings(){
 const b=document.getElementById('setBody');
 const st=typeof PosSync!=='undefined'?PosSync.getConfig():{mode:'local',channel:'kitchen'};
 const dev=typeof PosSync!=='undefined'?PosSync.deviceId():'—';
 b.innerHTML=`
  <div class="sec"><div class="sec-t">${t('appearance')}</div>
   <div class="opt-row"><div class="opt-txt"><div class="t">${t('appearance')}</div><div class="d">${t('themeD')}</div></div>
    <div class="opt-ctl"><div class="seg" id="themeSeg">
     <button data-th="light" class="${S.theme==='light'?'on':''}">☀️ ${t('light')}</button>
     <button data-th="dark" class="${S.theme==='dark'?'on':''}">🌙 ${t('dark')}</button>
     <button data-th="auto" class="${S.theme==='auto'?'on':''}">🖥️ ${t('auto')}</button></div></div></div>
   <div class="opt-row"><div class="opt-txt"><div class="t">${t('language')}</div><div class="d">${t('langD')}</div></div>
    <div class="opt-ctl"><div class="seg" id="langSeg" style="min-width:150px">
     <button data-lg="ar" class="${S.lang==='ar'?'on':''}">العربية</button>
     <button data-lg="en" class="${S.lang==='en'?'on':''}">English</button></div></div></div></div>
  <div class="sec"><div class="sec-t">${t('branding')}</div>
   <div class="opt-row" style="align-items:flex-start">
    <div class="logo-preview" id="lp">${S.logo?`<img src="${S.logo}">`:SVG.logo}</div>
    <div class="opt-txt" style="padding-top:2px"><div class="t">${t('logo')}</div><div class="d">${t('logoD')}</div>
     <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn btn-ghost" style="height:36px" id="upLogo">${SVG.upload} ${t('changeLogo')}</button>
      ${S.logo?`<button class="btn btn-danger" style="height:36px" id="rmLogo">${SVG.trash} ${t('removeLogo')}</button>`:''}</div></div></div>
   <div class="field" style="margin-top:13px"><label>${t('restName')}</label><input class="input" id="setName" value="${esc(S.name[S.lang]||'')}"></div>
   <div class="field"><label>${t('restTag')}</label><input class="input" id="setTag" value="${esc(S.tag[S.lang]||'')}"></div></div>
  <div class="sec"><div class="sec-t">${t('orderPrefs')}</div>
   <div class="opt-row"><div class="opt-txt"><div class="t">${t('servicePct')}</div><div class="d">${t('serviceD')}</div></div>
    <div class="opt-ctl"><input class="input" id="setSvc" type="number" min="0" max="50" step="0.5" value="${Number(S.service)||0}" style="width:92px;text-align:center"></div></div>
   <div class="opt-row"><div class="opt-txt"><div class="t">${t('waNo')}</div><div class="d">${t('waPh')}</div></div>
    <div class="opt-ctl"><input class="input" id="setWa" inputmode="tel" value="${esc(S.wa||'')}" placeholder="${t('waPh')}" style="width:170px"></div></div>
   <div class="opt-row"><div class="opt-txt"><div class="t">${t('currency')}</div><div class="d">EGP</div></div>
    <div class="opt-ctl"><span class="tag">${t('cur')}</span></div></div></div>
  <div class="sec"><div class="sec-t">${t('sync')}</div>
   <div class="opt-row"><div class="opt-txt"><div class="t">${t('syncMode')}: ${t('syncLocal')}</div><div class="d">${t('syncLocalD')}</div></div>
    <div class="opt-ctl"><div class="seg" id="modeSeg" style="min-width:190px">
     <button data-md="local" class="${st.mode!=='firebase'?'on':''}">📱 ${t('syncLocal')}</button>
     <button data-md="firebase" class="${st.mode==='firebase'?'on':''}">☁️ ${t('syncCloud')}</button></div></div></div>
   <div id="fbWrap" style="${st.mode==='firebase'?'':'display:none'}">
    <div class="field"><label>${t('fbCfg')}</label>
     <textarea class="textarea" id="fbCfg" style="min-height:90px;font-family:monospace;font-size:12px;direction:ltr"
      placeholder='{"apiKey":"…","databaseURL":"https://….firebaseio.com"}'>${esc(st.firebase?JSON.stringify(st.firebase):'')}</textarea></div>
    <div class="opt-row"><div class="opt-txt"><div class="t">${t('channel')}</div><div class="d">${esc(st.channel||'kitchen')}</div></div>
     <div class="opt-ctl"><input class="input" id="setChannel" value="${esc(st.channel||'kitchen')}" style="width:140px"></div></div></div>
   <div class="opt-row"><div class="opt-txt"><div class="t">${t('device')}</div><div class="d">${esc(dev)}</div></div></div>
   <button class="btn btn-primary btn-block" id="applySync" style="margin-top:10px">🚀 ${t('applySync')}</button></div>`;
 b.querySelectorAll('[data-th]').forEach(x=>x.onclick=()=>{S.theme=x.dataset.th;save(K.set,S);applyTheme();openSettings();});
 b.querySelectorAll('[data-lg]').forEach(x=>x.onclick=()=>{setLang(x.dataset.lg);openSettings();});
 b.querySelectorAll('[data-md]').forEach(x=>x.onclick=()=>{
  b.querySelectorAll('[data-md]').forEach(y=>y.classList.toggle('on',y===x));
  document.getElementById('fbWrap').style.display=x.dataset.md==='firebase'?'':'none';});
 document.getElementById('upLogo').onclick=()=>document.getElementById('logoFile').click();
 const rm=document.getElementById('rmLogo');
 if(rm)rm.onclick=()=>{S.logo=null;save(K.set,S);renderBrand();openSettings();};
 const bind=(el,fn)=>{const e=document.getElementById(el);if(e)e.oninput=ev=>fn(ev.target.value);};
 bind('setName',v=>{S.name[S.lang]=v.trim();save(K.set,S);renderBrand();});
 bind('setTag',v=>{S.tag[S.lang]=v.trim();save(K.set,S);renderBrand();});
 bind('setSvc',v=>{S.service=Math.max(0,Math.min(50,parseFloat(v)||0));save(K.set,S);renderCart();});
 bind('setWa',v=>{S.wa=v.trim();save(K.set,S);});
 document.getElementById('applySync').onclick=()=>{
  if(typeof PosSync==='undefined'){toast('⚠️ pos-sync.js not loaded');return;}
  const mode=document.querySelector('#modeSeg .on')?.dataset.md||'local';
  let fb=null;
  if(mode==='firebase'){try{fb=JSON.parse(document.getElementById('fbCfg').value||'{}');}catch(e){toast('⚠️ JSON?');return;}}
  const ch=document.getElementById('setChannel').value.trim()||'kitchen';
  PosSync.setConfig({mode,firebase:fb,channel:ch});toast(t('saved'));updateSyncPill();openSettings();};
 openModal('mSettings');}
document.getElementById('logoFile').addEventListener('change',e=>{
 const f=e.target.files?.[0];if(!f)return;
 if(f.size>4*1024*1024){toast('⚠️ 4MB max');return;}
 const r=new FileReader();
 r.onload=()=>{const img=new Image();
  img.onload=()=>{const cv=document.createElement('canvas');cv.width=cv.height=256;
   const cx=cv.getContext('2d'),s=Math.min(img.width,img.height);
   cx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);
   S.logo=cv.toDataURL('image/png');save(K.set,S);renderBrand();openSettings();toast(t('saved'));};
  img.src=r.result;};
 r.readAsDataURL(f);e.target.value='';});
document.getElementById('btnResetAll').onclick=()=>{
 if(!confirm(t('resetQ')))return;
 S=structuredClone(DEF);cart=[];favs=[];ord={type:'dinein',table:'',note:'',pay:'cash'};
 ui={cat:'all',q:'',sort:'pop',favOnly:false};
 Object.keys(localStorage).filter(k=>k.startsWith('kb.')).forEach(k=>localStorage.removeItem(k));
 boot();closeModal('mSettings');toast(t('resetDone'));};

/* ================= EVENTS ================= */
function setLang(lg){S.lang=lg;save(K.set,S);
 applyTheme();applyStaticText();renderBrand();renderCats();renderGrid();renderCart();renderKitchen();updateSyncPill();}
document.getElementById('btnLang').onclick=()=>setLang(S.lang==='ar'?'en':'ar');
document.getElementById('btnTheme').onclick=()=>{const o=['light','dark','auto'];
 S.theme=o[(o.indexOf(S.theme)+1)%3];save(K.set,S);applyTheme();};
document.getElementById('btnSettings').onclick=openSettings;
document.getElementById('btnCart').onclick=openDrawer;
document.getElementById('btnCloseCart').onclick=closeDrawer;
document.getElementById('btnKitchen').onclick=()=>{renderKitchen();openModal('mKitchen');};
document.getElementById('btnFav').onclick=e=>{ui.favOnly=!ui.favOnly;
 e.currentTarget.classList.toggle('on',ui.favOnly);
 document.getElementById('favIcn').style.fill=ui.favOnly?'var(--accent)':'none';renderGrid();};
let sTimer;
document.getElementById('searchInput').addEventListener('input',e=>{
 clearTimeout(sTimer);sTimer=setTimeout(()=>{ui.q=e.target.value;renderGrid();},130);});
document.getElementById('sortSel').addEventListener('change',e=>{ui.sort=e.target.value;renderGrid();});
document.addEventListener('keydown',e=>{
 const typing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
 if(e.key==='/'&&!typing){e.preventDefault();document.getElementById('searchInput').focus();}
 if(e.key==='Escape'){document.querySelectorAll('.modal.show').forEach(m=>closeModal(m.id));
  if(drawer.classList.contains('open'))closeDrawer();
  if(typing)document.activeElement.blur();}});

/* ================= TOAST ================= */
function toast(msg){const box=document.getElementById('toasts');
 const el=document.createElement('div');el.className='toast';
 el.innerHTML=`<span class="dot"></span><span>${esc(msg)}</span>`;box.appendChild(el);
 setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},2400);}

/* ================= BOOT ================= */
function boot(){applyTheme();applyStaticText();renderBrand();renderCats();renderGrid();renderCart();renderKitchen();updateSyncPill();}
boot();
</script>
</body>
